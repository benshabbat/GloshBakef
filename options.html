<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הגדרות מסנן תמונות</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>הגדרות מסנן תמונות</h1>
    <label class="setting"><span>המסנן פעיל</span><input id="enabled" type="checkbox"></label>
    <label class="setting" for="keywords">מילות חסימה, מופרדות בפסיקים</label>
    <textarea id="keywords" rows="5" spellcheck="false"></textarea>
    <button id="save" type="button">שמירה</button>
    <p id="status" role="status"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
